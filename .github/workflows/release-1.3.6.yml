name: Publish CBosses 1.3.6

on:
  push:
    branches: [claude/project-thread-yrwq2w]
    paths: [.github/workflows/release-1.3.6.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cbosses-1.3.6
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 1009d91b88a7f99952e09adb661e3976a7c1a2a1
      CHECKED_RUN: '42231730521'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.3.6 >/dev/null 2>&1; then
            echo 'Release v1.3.6 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CBosses --dir tested
          test -f tested/CBosses-1.3.6.jar
          grep -Fq 'version = "1.3.6"' build.gradle.kts
      - name: Package source, guides and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CBosses-1.3.6.jar out/
          git archive --format=zip --prefix=CBosses/ --output=out/CBosses-1.3.6-source.zip HEAD
          cp out/CBosses-1.3.6.jar out/CBosses-1.3.6-source.zip RELEASE-1.3.6.md README.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.3.6','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':15,'note':'JAR is downloaded unchanged from the successful build and server test run (Paper 1.21.4, Paper 26.2, Paper latest, Folia latest).','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CBosses-1.3.6-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CBosses-1.3.6/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CBosses-1.3.6-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          { tail -n +3 RELEASE-1.3.6.md; printf '\n## Files\n\n'
            printf -- '- `CBosses-1.3.6.jar`: the plugin. Put it in `plugins/`.\n'
            printf -- '- `CBosses-1.3.6-release.zip`: the jar, the source, these notes, the README and `MANIFEST.json` with checksums.\n'
            printf -- '- `CBosses-1.3.6-source.zip`: the full source code.\n'
            printf -- '- `CBosses-1.3.6-CHECKSUMS.txt`: SHA256 and SHA1 of every file.\n'
            printf '\nTested build: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$CHECKED_RUN"; } > out/notes.md
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.6 out/CBosses-1.3.6.jar out/CBosses-1.3.6-source.zip out/CBosses-1.3.6-release.zip out/CBosses-1.3.6-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CBosses 1.3.6 - every block drawn exactly in game' --notes-file out/notes.md --draft
          test "$(gh release view v1.3.6 --json assets --jq '.assets | length')" = 4
          gh release edit v1.3.6 --draft=false --latest
          gh release view v1.3.6 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
